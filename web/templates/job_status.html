{% extends "base.html" %}

{% block content %}
<div class="topbar">
    <h1>Processamento</h1>
    <p>Acompanhe a execução em tempo real.</p>
</div>

<div class="card">
    <h3>Status do job</h3>

    <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <strong>Progresso</strong>
            <span id="progress-text">0/0</span>
        </div>
        <div style="background:#e2e8f0;border-radius:999px;height:12px;overflow:hidden;">
            <div id="progress-bar" style="height:12px;width:0%;background:#2563eb;border-radius:999px;"></div>
        </div>
    </div>

    <pre id="logbox" style="
        background:#020617;
        color:#d1fae5;
        padding:18px;
        border-radius:14px;
        min-height:260px;
        max-height:420px;
        overflow:auto;
        font-size:13px;
        line-height:1.5;
    "></pre>

    <div id="download-area" style="display:none; margin-top:18px;">
        <div class="success">
            Arquivo gerado com sucesso.<br>
            <a id="download-link" href="#" download>Baixar arquivo</a>
        </div>
    </div>

    <a class="back" href="/">← Voltar ao dashboard</a>
</div>

<script>
    const jobId = "{{ job_id }}";
    const logbox = document.getElementById("logbox");
    const downloadArea = document.getElementById("download-area");
    const downloadLink = document.getElementById("download-link");

    const evtSource = new EventSource(`/jobs/${jobId}/stream`);

    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");

    evtSource.onmessage = function(event) {
        const data = JSON.parse(event.data);

        if (data.type === "log") {
            logbox.textContent += data.message + "\n";
            logbox.scrollTop = logbox.scrollHeight;
        }

        if (data.type === "progress") {
            const progress = data.progress || 0;
            const total = data.total || 0;

            progressText.textContent = `${progress}/${total}`;

            const percent = total > 0 ? Math.round((progress / total) * 100) : 0;
            progressBar.style.width = `${percent}%`;
        }

        if (data.type === "done") {
            logbox.textContent += "\nFinalizado.\n";

            if (data.files && data.files.length > 0) {
                downloadArea.style.display = "block";
                downloadArea.innerHTML = "";

                data.files.forEach(file => {
                    const div = document.createElement("div");
                    div.className = "success";
                    div.innerHTML = `
                        ${file.periodo}<br>
                        <a href="${file.url}" download>Baixar ${file.name}</a>
                    `;
                    downloadArea.appendChild(div);
                });
            } else if (data.download_url) {
                downloadLink.href = data.download_url;
                downloadArea.style.display = "block";
            }

            evtSource.close();
        }

        if (data.type === "error") {
            logbox.textContent += "\nERRO: " + data.message + "\n";
            evtSource.close();
        }
    
    };
</script>
{% endblock %}
