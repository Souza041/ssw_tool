<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Renomeador de Notas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 28px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .box {
            border: 2px dashed #c7ceda;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            background: #fafbff;
            margin: 22px 0;
        }

        input[type="file"] {
            margin-top: 14px;
        }

        button {
            background: #111827;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .hint {
            color: #6b7280;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            color: #374151;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Renomeador de Notas</h1>

    <p>
        Envie os canhotos ou DACTEs em imagem.
        O sistema tentará identificar o número da NF-e e devolverá um ZIP com os arquivos renomeados.
    </p>

    <form action="/renomeador" method="post" enctype="multipart/form-data">
        <div class="box">
            <strong>Selecione as imagens</strong>
            <p class="hint">Formatos aceitos: PNG, JPG e JPEG</p>

            <input
                type="file"
                name="arquivos"
                multiple
                accept=".png,.jpg,.jpeg"
                required
            >
        </div>

        <button type="submit">Renomear arquivos</button>
    </form>

    <a class="back" href="/">Voltar ao início</a>
</div>
</body>
</html>
