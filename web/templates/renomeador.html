<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Carrier LG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 28px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .box {
            border: 2px dashed #c7ceda;
            border-radius: 12px;
            padding: 24px;
            background: #fafbff;
            margin: 18px 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="file"],
        input[type="email"],
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        button {
            background: #111827;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .hint {
            color: #6b7280;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            color: #374151;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Carrier LG</h1>

    <p>
        Envie os canhotos/DACTEs e a base diária da LG.
        O sistema renomeia as imagens, cruza NF x Load ID e gera os arquivos Carrier em lotes de 20 notas.
    </p>

    <form action="/renomeador" method="post" enctype="multipart/form-data">
        <div class="box">
            <label>Canhotos / DACTEs</label>
            <p class="hint">Formatos aceitos: PNG, JPG e JPEG</p>
            <input type="file" name="arquivos" multiple accept=".png,.jpg,.jpeg" required>
        </div>

        <div class="box">
            <label>Base diária (CSV ou Excel)</label>
            <p class="hint">Arquivo CSV baixado do sistema, com colunas NF No, NS No e Load ID.</p>
            <input type="file" name="base_csv" accept=".csv,.xlsx,.xls" required>
        </div>

        <div class="box">
            <label>E-mail para comunicação</label>
            <input type="email" name="email" value="gce4@rodobrastransp.com.br" required>
        </div>

        <div class="box">
            <label>Observações</label>
            <input type="text" name="observacao" placeholder="Opcional">
        </div>

        <button type="submit">Processar Carrier LG</button>
    </form>

    <a class="back" href="/renomeador">Limpar tela</a>
</div>
</body>
</html>
