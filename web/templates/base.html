<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SSW Tool</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #1d4ed8;
            --primary-dark: #1e40af;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .layout {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 260px 1fr;
        }

        aside {
            background: #0f172a;
            color: white;
            padding: 28px 22px;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 32px;
        }

        nav a {
            display: block;
            color: #e2e8f0;
            padding: 11px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            background: #1e293b;
        }

        main {
            padding: 36px;
        }

        .topbar {
            margin-bottom: 28px;
        }

        .topbar h1 {
            margin: 0;
            font-size: 28px;
        }

        .topbar p {
            margin-top: 8px;
            color: var(--muted);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 28px;
            border-radius: 18px;
            max-width: 780px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
        }

        .card h3 {
            margin-top: 0;
            font-size: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }

        button {
            width: 100%;
            padding: 12px 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .success {
            background: var(--success-bg);
            color: var(--success-text);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .success a {
            color: var(--success-text);
            text-decoration: underline;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
            max-width: 980px;
        }

        .module-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 10px 30px rgba(15, 23, 42, .05);
            transition: .15s ease;
        }

        .module-card:hover {
            transform: translateY(-2px);
            border-color: #bfdbfe;
        }

        .module-card strong {
            display: block;
            margin-bottom: 8px;
            font-size: 17px;
        }

        .module-card span {
            color: var(--muted);
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        code {
            display: inline-block;
            background: #f1f5f9;
            padding: 5px 8px;
            border-radius: 8px;
            margin: 3px 0;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            aside {
                position: relative;
            }

            main {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside>
        <div class="brand">SSW Tool</div>
        <div class="subtitle">Automações HTTP Rodobras</div>

        {% if request.session.get("ssw_session_id") %}
        <nav>
            <a href="/">Dashboard</a>
            <a href="/op001">OP001 - Coletas NFD</a>
            <a href="/op001-transporte">OP001 - Coletas Transporte</a>
            <a href="/op103">OP103 - Devolução/Reversa</a>
            <a href="/op150">OP150 - Relatório</a>
            <a href="/op455">OP455 - CTRCs</a>
            <a href="/op488">OP488 - Despesas</a>
        </nav>
        {% endif %}
    </aside>

    <main>
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
