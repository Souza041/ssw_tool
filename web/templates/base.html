<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SSW Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 16px 32px;
        }

        main {
            padding: 32px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            max-width: 720px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .success {
            background: #dcfce7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
    </style>
</head>
<body>
<header>
    <h2>SSW Tool</h2>
</header>

<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
